<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скріпка Кава | Преміальний 3D Досвід</title>
    
    <!-- GSAP анімації -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        @font-face {
            font-family: 'Pilowlava';
            src: url('https://fonts.cdnfonts.com/s/91224/Pilowlava-Regular.woff') format('woff');
        }

        :root {
            --cream: #FDFBF7;
            --blob-color: #F2EDE4;
            --blue: #4A76A8;
            --dark: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--cream); color: var(--dark); font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }

        /* Навігація */
        header {
            position: fixed; top: 0; width: 100%; padding: 40px 8%;
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }
        .logo { font-family: 'Pilowlava'; font-size: 3rem; color: var(--blue); text-decoration: none; }
        .nav-links a { margin-left: 35px; text-decoration: none; color: var(--dark); font-weight: bold; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 2px; }

        /* Hero Section */
        .hero { 
            height: 100vh; display: flex; align-items: center; 
            padding: 0 8%; position: relative; justify-content: space-between;
        }
        
        .hero-text { flex: 0 0 45%; z-index: 10; }
        .hero-text h1 { font-family: 'Pilowlava'; font-size: 9vw; line-height: 0.8; color: var(--blue); margin-bottom: 30px; }
        .hero-text p { font-size: 1.3rem; margin-bottom: 40px; color: #444; max-width: 450px; }

        /* ВЕЛИКИЙ ВІЗУАЛ */
        .hero-visual { 
            flex: 0 0 55%; height: 100%; display: flex; 
            align-items: center; justify-content: center; position: relative; 
        }

        /* Анімована пляма за стаканчиком */
        .blob {
            position: absolute;
            width: 700px; height: 700px;
            background: var(--blob-color);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            z-index: 1;
            filter: blur(40px);
            animation: morph 10s infinite alternate ease-in-out;
        }

        @keyframes morph {
            0% { border-radius: 40% 60% 70% 30%; transform: scale(1); }
            100% { border-radius: 60% 40% 30% 70%; transform: scale(1.1); }
        }

        /* КОНТЕЙНЕР ДЛЯ 3D СТАКАНЧИКА */
        .cup-container { 
            position: relative; z-index: 5; perspective: 2000px; 
            width: 600px; height: 600px; display: flex; align-items: center; justify-content: center;
        }

        .cup-img { 
            width: 550px; /* ЗБІЛЬШЕНО */
            height: auto; 
            /* АВТОМАТИЧНЕ ПОКРАЩЕННЯ ЯКОСТІ */
            filter: contrast(1.1) saturate(1.1) brightness(1.02) drop-shadow(0 30px 60px rgba(0,0,0,0.2)); 
            transition: opacity 0.15s ease-in-out;
            image-rendering: high-quality;
        }

        .btn { 
            padding: 22px 50px; background: var(--blue); color: white; 
            text-decoration: none; border-radius: 100px; font-weight: bold; 
            display: inline-block; transition: 0.4s; border: none; font-size: 1.1rem;
            box-shadow: 0 15px 35px rgba(74, 118, 168, 0.3);
        }
        .btn:hover { transform: translateY(-7px); box-shadow: 0 25px 50px rgba(74, 118, 168, 0.5); }

        /* Telegram */
        .tg-link { 
            position: fixed; bottom: 40px; right: 40px; width: 70px; height: 70px; 
            background: #0088cc; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; z-index: 1000; transition: 0.3s; 
        }
        .tg-link:hover { transform: scale(1.15) rotate(15deg); }

        /* Слайдер відгуків */
        .reviews-wrap { padding: 120px 8%; text-align: center; background: white; border-radius: 80px 80px 0 0; position: relative; z-index: 20; margin-top: -80px; }
        .review-box { max-width: 900px; margin: 40px auto; position: relative; height: 200px; }
        .review-text { font-size: 2rem; font-style: italic; opacity: 0; display: none; position: absolute; width: 100%; }
        .review-text.active { opacity: 1; display: block; }
        .arrows { display: flex; justify-content: center; gap: 30px; margin-top: 50px; }
        .arrow { width: 70px; height: 70px; border: 2px solid var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--blue); font-size: 2rem; transition: 0.3s; }
        .arrow:hover { background: var(--blue); color: white; }

    </style>
</head>
<body>

    <a href="https://t.me/skripka_kava" class="tg-link" target="_blank">
        <svg width="35" height="35" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .24z"/></svg>
    </a>

    <header>
        <a href="#" class="logo">СКРІПКА</a>
        <nav class="nav-links">
            <a href="menu.html">МЕНЮ</a>
            <a href="tel:0730081598">ЗВ'ЯЗОК</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h1>SKRIPKA<br>KAVA</h1>
            <p>Ваш щоденний ритуал у Файна Таун тепер у повному 3D огляді.</p>
            <a href="menu.html" class="btn">ПЕРЕГЛЯНУТИ МЕНЮ</a>
        </div>

        <div class="hero-visual">
            <div class="blob"></div>
            <div class="cup-container" id="cup-scene">
                <!-- ГОЛОВНЕ ЗОБРАЖЕННЯ, ЯКЕ БУДЕ ЗМІНЮВАТИСЬ -->
                <img src="front.png" alt="Skripka Cup" class="cup-img" id="cup-view">
            </div>
        </div>
    </section>

    <section class="reviews-wrap">
        <h2 style="font-family: 'Pilowlava'; font-size: 3rem; color: var(--blue); margin-bottom: 20px;">Що кажуть гості</h2>
        <div class="review-box">
            <div class="review-text active">"Дуже атмосферно, кава 10/10!"<br><small>— Никита Дима</small></div>
            <div class="review-text">"Найкращі десерти без цукру у місті."<br><small>— Liza Shpak</small></div>
            <div class="review-text">"Смузі та лимонади — моя любов."<br><small>— Helga Lindemann</small></div>
        </div>
        <div class="arrows">
            <div class="arrow" id="prev">←</div>
            <div class="arrow" id="next">→</div>
        </div>
    </section>

    <script>
        const cupImg = document.getElementById('cup-view');
        const cupScene = document.getElementById('cup-scene');

        // Попереднє завантаження для плавності
        const images = {
            left: 'left.png',
            front: 'front.png',
            right: 'right.png'
        };

        // ЛОГІКА 3D ПОВОРОТУ
        document.addEventListener('mousemove', (e) => {
            const xPercent = e.clientX / window.innerWidth;
            
            // Визначаємо ракурс
            let currentImg = images.front;
            if (xPercent < 0.35) currentImg = images.left;
            if (xPercent > 0.65) currentImg = images.right;

            if (cupImg.src.indexOf(currentImg) === -1) {
                cupImg.src = currentImg;
            }

            // Додатковий нахил (parallax)
            const rotateY = (xPercent - 0.5) * 30;
            const rotateX = (e.clientY / window.innerHeight - 0.5) * -20;
            
            gsap.to(cupImg, {
                rotationY: rotateY,
                rotationX: rotateX,
                duration: 0.5,
                ease: "power2.out"
            });
        });

        // Ефект плавного плавання стаканчика
        gsap.to(cupImg, {
            y: -20,
            duration: 2,
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut"
        });

        // СЛАЙДЕР ВІДГУКІВ
        const revs = document.querySelectorAll('.review-text');
        let cur = 0;

        function showRev(i) {
            gsap.to(revs[cur], { opacity: 0, y: 20, duration: 0.3, onComplete: () => {
                revs[cur].classList.remove('active');
                cur = i;
                revs[cur].classList.add('active');
                gsap.fromTo(revs[cur], { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5 });
            }});
        }

        document.getElementById('next').onclick = () => showRev((cur + 1) % revs.length);
        document.getElementById('prev').onclick = () => showRev((cur - 1 + revs.length) % revs.length);
    </script>
</body>
</html>
